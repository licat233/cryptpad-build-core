
services:
  cryptpad:
    image: node:lts-slim
    hostname: cryptpad
    working_dir: /cryptpad
    entrypoint: ["node", "server"]
    volumes:
      - ./cryptpad:/cryptpad
    ports:
      - "3001:3001"
      - "3000:3000"
      - "3003:3003"

    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
